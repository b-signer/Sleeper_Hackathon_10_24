[project]
name = "sleeper"
version = "0.1.0"
description = "An agent that finds underrated GitHub repos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.27",
    "pydantic>=2.14.1",
    "python-dotenv>=1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
sleeper = "sleeper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits real APIs (GitHub, OpenRouter); skipped by default. Run with: uv run pytest -m live",
]
